<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stick Fight</title>
<style>
  html,body {
    margin:0; height:100%; overflow:hidden;
    background:#0f1724; color:#fff; font-family:sans-serif;
  }
  canvas {
    display:block;
    background:#0f1724;
  }
  /* --- MENU --- */
  #menu {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.7);
    flex-direction: column;
  }
  h1 {
    font-size: 32px;
    margin-bottom: 20px;
  }
  button {
    margin: 8px;
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 6px;
    background: #3b82f6;
    color: white;
    cursor: pointer;
  }
  button:hover {
    background: #2563eb;
  }
</style>
</head>
<body>
<div id="menu">
  <h1>Stick Fight</h1>
  <button id="btn1p">1 Player</button>
  <button id="btn2p">2 Players</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = innerWidth;
canvas.height = innerHeight;

let running = false;
let players = [];
let platforms = [];

const keys = {};
onkeydown = e => keys[e.code] = true;
onkeyup = e => keys[e.code] = false;

function makePlayer(x, color, controls) {
  return {x, y:100, w:20, h:50, vx:0, vy:0, color, controls, onGround:false};
}

function startGame(mode) {
  document.getElementById('menu').style.display = 'none';
  running = true;
  players = [makePlayer(100,'white',{left:'ArrowLeft',right:'ArrowRight',jump:'ArrowUp'})];
  if(mode==='2p') players.push(makePlayer(200,'#38bdf8',{left:'KeyA',right:'KeyD',jump:'KeyW'}));

  // platforms
  const g = canvas.height - 60;
  platforms = [
    {x:0,y:g,w:canvas.width,h:60},
    {x:200,y:g-150,w:200,h:15},
    {x:600,y:g-250,w:200,h:15},
    {x:1000,y:g-350,w:250,h:15},
    {x:1400,y:g-180,w:250,h:15},
  ];
  loop();
}

function updatePlayer(p){
  const spd = 5;
  if(keys[p.controls.left]) p.vx = -spd;
  else if(keys[p.controls.right]) p.vx = spd;
  else p.vx = 0;
  if(keys[p.controls.jump] && p.onGround){
    p.vy = -15;
    p.onGround = false;
  }
  p.vy += 0.8; // gravity
  p.x += p.vx;
  p.y += p.vy;

  // collision
  p.onGround = false;
  for(const plat of platforms){
    if(p.x + p.w > plat.x && p.x < plat.x + plat.w &&
       p.y + p.h > plat.y && p.y + p.h < plat.y + 20 && p.vy >= 0){
         p.y = plat.y - p.h;
         p.vy = 0;
         p.onGround = true;
    }
  }
}

function drawPlayer(p){
  const cx = p.x + p.w/2;
  ctx.strokeStyle = p.color;
  ctx.lineWidth = 3;
  // head
  ctx.beginPath(); ctx.arc(cx,p.y+10,8,0,Math.PI*2); ctx.stroke();
  // body
  ctx.beginPath(); ctx.moveTo(cx,p.y+18); ctx.lineTo(cx,p.y+38); ctx.stroke();
  // arms
  ctx.beginPath(); ctx.moveTo(cx,p.y+25); ctx.lineTo(cx-10,p.y+35); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,p.y+25); ctx.lineTo(cx+10,p.y+35); ctx.stroke();
  // legs
  ctx.beginPath(); ctx.moveTo(cx,p.y+38); ctx.lineTo(cx-8,p.y+50); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,p.y+38); ctx.lineTo(cx+8,p.y+50); ctx.stroke();
}

function drawPlatforms(){
  ctx.fillStyle = '#1e293b';
  for(const p of platforms) ctx.fillRect(p.x,p.y,p.w,p.h);
}

function loop(){
  if(!running) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawPlatforms();
  for(const p of players){
    updatePlayer(p);
    drawPlayer(p);
  }
  requestAnimationFrame(loop);
}

// menu buttons
document.getElementById('btn1p').onclick = () => startGame('1p');
document.getElementById('btn2p').onclick = () => startGame('2p');
</script>
</body>
</html>
