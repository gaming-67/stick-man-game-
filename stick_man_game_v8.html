<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Stick Fight — Fixed Menu</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#0f1724;color:#e6eef8;}
  canvas{display:block;width:100%;height:100%;background:#0f1724;}
  
  /* MENU OVERLAY FIX */
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 9999; /* make menu clickable */
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.6);
  }
  .menu {
    background: rgba(20,25,40,0.9);
    border: 2px solid #7dd3fc;
    border-radius: 12px;
    padding: 20px 30px;
    text-align: center;
    width: 320px;
  }
  .menu h1 {
    margin-bottom: 10px;
    font-size: 24px;
  }
  .btn {
    display: block;
    width: 100%;
    margin: 10px 0;
    padding: 12px;
    background: linear-gradient(90deg,#7dd3fc,#60a5fa);
    border: none;
    color: #071127;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn:hover {
    transform: scale(1.05);
  }
</style>
</head>
<body>

<div class="overlay" id="menuOverlay">
  <div class="menu">
    <h1>Stick Fight</h1>
    <button class="btn" id="onePlayerBtn">▶ 1 Player</button>
    <button class="btn" id="twoPlayerBtn">▶ 2 Players</button>
    <button class="btn" id="practiceBtn">Practice Mode</button>
  </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let mode = 'menu';
let running = false;
let players = [];

function startGame(selectedMode) {
  mode = selectedMode;
  document.getElementById('menuOverlay').style.display = 'none';
  running = true;
  initGame();
}

document.getElementById('onePlayerBtn').addEventListener('click', () => startGame('1p'));
document.getElementById('twoPlayerBtn').addEventListener('click', () => startGame('2p'));
document.getElementById('practiceBtn').addEventListener('click', () => startGame('practice'));

const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function initGame() {
  players = [{x:100,y:canvas.height-100,w:20,h:50,color:'white',vx:0,vy:0,jumping:false,controls:{left:'ArrowLeft',right:'ArrowRight',jump:'ArrowUp'}}];
  if(mode === '2p'){
    players.push({x:200,y:canvas.height-100,w:20,h:50,color:'#7dd3fc',vx:0,vy:0,jumping:false,controls:{left:'KeyA',right:'KeyD',jump:'KeyW'}});
  }
  gameLoop();
}

function updatePlayer(p){
  if(keys[p.controls.left]) p.x -= 5;
  if(keys[p.controls.right]) p.x += 5;
  if(keys[p.controls.jump] && !p.jumping){
    p.vy = -12;
    p.jumping = true;
  }
  p.vy += 0.8;
  p.y += p.vy;
  const ground = canvas.height - 50;
  if(p.y + p.h > ground){
    p.y = ground - p.h;
    p.vy = 0;
    p.jumping = false;
  }
}

function drawPlayer(p){
  const cx = p.x + p.w/2;
  ctx.strokeStyle = p.color;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx,p.y+10,8,0,Math.PI*2); ctx.stroke(); // head
  ctx.beginPath(); ctx.moveTo(cx,p.y+18); ctx.lineTo(cx,p.y+38); ctx.stroke(); // body
  ctx.beginPath(); ctx.moveTo(cx,p.y+38); ctx.lineTo(cx-8,p.y+50); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,p.y+38); ctx.lineTo(cx+8,p.y+50); ctx.stroke();
}

function drawGround(){
  ctx.fillStyle = '#152238';
  ctx.fillRect(0,canvas.height-50,canvas.width,50);
}

function gameLoop(){
  if(!running) return;
  ctx.fillStyle = '#0f1724';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  drawGround();
  for(const p of players){
    updatePlayer(p);
    drawPlayer(p);
  }
  requestAnimationFrame(gameLoop);
}
</script>

</body>
</html>
